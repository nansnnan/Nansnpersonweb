<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南山南的个人站</title>
  <meta name="description" content="南山南的个人站 —— 快捷·实用·贴心">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container hero-inner">
      <p class="hero-eyebrow">PERSONAL SITE</p>
      <h1 class="hero-title">南山南的个人站</h1>
      <p class="hero-subtitle">快捷 · 实用 · 贴心</p>

      <div class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input
          id="site-search"
          type="search"
          class="search-input"
          placeholder="搜索站内内容，例如「二维码」"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-controls="search-results"
          aria-autocomplete="list"
          aria-label="站内搜索"
        >
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
    </div>
  </header>

  <main>
    <section id="functions" class="container section">
      <div class="section-head">
        <h2 class="section-title">功能区</h2>
        <p class="section-desc">常用的快捷工具会陆续上线</p>
      </div>

      <div class="category">
        <h3 class="category-title">斗地主</h3>
        <div class="card-grid">
          <a class="card card-tool" href="ddz.html">
            <div class="card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="3" width="9" height="13" rx="2"></rect>
                <path d="M6.5 7.5v9a2 2 0 0 0 2 2h7"></path>
                <path d="M12.5 7.5l1.6 2.3h-3.2z"></path>
              </svg>
            </div>
            <div class="card-body">
              <div class="card-title-row">
                <h3 class="card-title">斗地主发牌器</h3>
                <span class="card-badge is-live">已上线</span>
              </div>
              <p class="card-desc">随机发牌、指定炸弹牌型与随机底牌统计</p>
            </div>
          </a>

          <a class="card card-tool" href="ddz-study.html">
            <div class="card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 15a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path>
                <path d="M8 9h8M8 13h5"></path>
              </svg>
            </div>
            <div class="card-body">
              <div class="card-title-row">
                <h3 class="card-title">斗地主研讨</h3>
                <span class="card-badge is-live">已上线</span>
              </div>
              <p class="card-desc">输入三家手牌，按标准规则模拟出牌与牌型校验</p>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-meta">
        <span class="site-version" data-site-version></span>
        <button
          class="changelog-trigger"
          type="button"
          data-dialog-open="changelog"
          aria-haspopup="dialog"
          aria-controls="changelog"
        >更新公告</button>
      </div>
      <p class="footer-slogan">南山南的个人站 · 快捷 · 实用 · 贴心</p>
    </div>
  </footer>

  <div id="changelog" class="modal" role="dialog" aria-modal="true" aria-labelledby="changelog-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="document">
      <header class="modal-head">
        <h2 id="changelog-title" class="modal-title">更新公告</h2>
        <button class="modal-close" type="button" aria-label="关闭更新公告" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </header>
      <div class="modal-body"></div>
    </div>
  </div>

  <script src="site.js"></script>
  <script src="app.js"></script>
</body>
</html>
